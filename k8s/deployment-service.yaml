apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-store
  namespace: books-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-store
  template:
    metadata:
      labels:
        app: books-store
    spec:
      containers:
      - name: books-store
        image: sakkoumhamza/books-store:develop
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URL
          value: "mongodb://mongo:27017/books"
        - name: PARSER_URL
          value: "http://books-parser:80"
        - name: MARKET_URL
          value: "http://books-market:80"
---
apiVersion: v1
kind: Service
metadata:
  name: books-store
  namespace: books-system
spec:
  selector:
    app: books-store
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
